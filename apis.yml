name: BlueTalon Data Systems
description: BlueTalon Data Systems was a data-centric security company that built dynamic, policy-based
  access control, data masking, filtering, and auditing for enterprise data platforms such as Hadoop,
  relational databases, and big-data stores. It let organizations enforce fine-grained authorization
  and privacy controls at the point of data access. Founded around 2013 and headquartered in Redwood
  City, California, BlueTalon was acquired by Microsoft in July 2019, after which its team and technology
  were absorbed into Microsoft's data-governance and security efforts (Azure). BlueTalon no longer
  operates as an independent company; the bluetalon.com domain is parked on Azure DNS with no active web,
  developer, or API surface, so this network profile carries identity only and has no live artifacts to
  enrich.
